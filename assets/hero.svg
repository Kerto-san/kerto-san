  <text x="92" y="116" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="34" font-weight="600" fill="#3FA796">MD</text>

  <!-- corner ticks -->
  <path d="M40 56 h8 M48 48 v8" stroke="#3FA796" stroke-width="2"/>
  <path d="M144 56 h-8 M136 48 v8" stroke="#3FA796" stroke-width="2"/>
  <path d="M40 144 h8 M48 152 v-8" stroke="#3FA796" stroke-width="2"/>
  <path d="M144 144 h-8 M136 152 v-8" stroke="#3FA796" stroke-width="2"/>

  <!-- wordmark -->
  <text x="168" y="100" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="42" font-weight="500" letter-spacing="0.5" fill="#E7ECEF">Marco DeLao</text>
  <text x="168" y="128" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#8B98A5">@Marco-DeLao</text>

  <!-- divider that doubles as a schematic trace -->
  <path d="M168 145 H1120" stroke="#8B98A5" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="1120" cy="145" r="3.5" fill="#3FA796"/>
  <path d="M1120 145 V182 H1156" stroke="#3FA796" stroke-opacity="0.6" stroke-width="1.5" fill="none"/>
  <circle cx="1156" cy="182" r="3" fill="#3FA796" fill-opacity="0.8"/>

  <!-- tagline placeholder — replace before publishing -->
  <text x="168" y="172" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#3FA796">[ role · specialization — replace this line ]</text>

  <!-- real, quiet data point -->
