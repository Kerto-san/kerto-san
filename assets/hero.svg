<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Marco DeLao — software engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141B22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="#0B0F14"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <!-- monogram plate -->
